const $=s=>document.querySelector(s), cv=$('#game'),cx=cv.getContext('2d'),overlay=$('#overlay'),hud=$('#hud'),controls=$('#controls');let W=420,H=780,DPR=1,state='menu',last=0,elapsed=0,score=0,hits=0,combo=0,best=Number(localStorage.getItem('catBest')||0),cat={x:.52,floor:0,move:0,swat:0,blink:0},owner={phase:'read',timer:4.5,look:0,warning:0},objects=[],particles=[],floaters=[],shakes=0,muted=localStorage.getItem('catMute')==='1',audioCtx=null,runSeed=0,submitted=false;

function musicTick(){if(muted||state!=='play')return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')return;const now=audioCtx.currentTime;if(musicNext<now-.5)musicNext=now+.03;while(musicNext<now+.12){const n=melody[musicStep%melody.length];note(n,musicNext,.018,.18);if(musicStep%8===0)note(bass[Math.floor(musicStep/8)%4],musicNext,.012,.45);musicStep++;musicNext+=.235}}catch(e){}}

const kinds=['🪴','🏺','☕','📚','⏰','🧸','📷','🕯️','🖼️','🧴'];function newObj(f,x){let kind=kinds[Math.floor(Math.random()*kinds.length)];return {f,x,kind,active:true,respawn:0,fall:0,fx:0,fy:0,rot:0,spin:0,value:({ '🏺':100,'🪴':60,'☕':35,'📚':25,'⏰':70,'🧸':30,'📷':80,'🕯️':25,'🖼️':55,'🧴':20})[kind]}}

function drawProp(kind,x,y,size=30){
 cx.save();cx.translate(x,y);const z=size/30;cx.scale(z,z);cx.lineJoin='round';cx.lineCap='round';cx.strokeStyle='#846c5d';cx.lineWidth=1.6;

 else if(kind==='☕'){rect(-12,-12,21,22,4,'#f8f3e8');cx.beginPath();cx.arc(10,-2,7,-1.5,1.5);cx.stroke();cx.beginPath();cx.arc(-3,-2,4,0,Math.PI*2);cx.fillStyle='#c1a18e';cx.fill()}

 else if(kind==='🧸'){ellipse(0,3,12,13,'#cba37b');ellipse(0,-13,11,10,'#d8b28b');ellipse(-9,-20,5,5,'#d8b28b');ellipse(9,-20,5,5,'#d8b28b');ellipse(0,-9,4,3,'#fff2df');ellipse(0,-10,2,2,'#795b50');}

function init(){objects=[];for(let f=0;f<3;f++)for(let j=0;j<3;j++)objects.push(newObj(f,.47+j*.19));cat={x:.55,floor:0,move:0,swat:0,blink:0};owner={phase:'read',timer:2.5,look:0,warning:0};elapsed=score=hits=combo=shakes=0;particles=[];floaters=[];runSeed=Date.now();submitted=false;$('#score').textContent=0;$('#time').textContent=0;$('#hits').textContent=0}

function menu(){state='menu';uiGame(false);overlay.style.display='flex';overlay.innerHTML=`<div class="panel"><span class="tag">🐾 日系療癒 × 欠揍貓咪</span><h1>貓咪搗蛋計畫</h1><p class="sub">趁主人看報紙，把整個家撥個精光！越玩回頭越快！</p><img class="meme" src="assets/innocent.webp" alt="貓咪裝無辜"><div class="buttons"><button class="btn" id="start">🐾 開始搗蛋</button><button class="btn ghost" id="rules">📖 玩法教學</button></div><div class="buttons"><button class="btn ghost" id="rank">🏆 排行榜</button><button class="btn ghost" id="mute">${muted?'🔇 開啟音樂與音效':'🎵 關閉音樂與音效'}</button></div><p class="smallnote">一命到底 · 無限撥落 · 越玩越難<br>電腦：← → 移動、↑ ↓ 換層、空白鍵撥落</p></div>`;$('#start').onclick=()=>{if(!localStorage.getItem('catTutorial'))tutorial(0);else start()};$('#rules').onclick=()=>tutorial(0);$('#rank').onclick=rank;$('#mute').onclick=()=>{muted=!muted;localStorage.setItem('catMute',muted?'1':'0');menu()}}

async function submitScore(){let name=($('#nickname')?.value||'').trim().slice(0,12)||'匿名貓奴';localStorage.setItem('catName',name);if(submitted){toast('這局已登記');return}submitted=true;if(!CLOUD.url||!CLOUD.anonKey){toast('已記錄本機排行榜！');return}try{const r=await fetch(CLOUD.url.replace(/\/$/,'')+'/rest/v1/cat_scores',{method:'POST',headers:{'Content-Type':'application/json',apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey,Prefer:'return=minimal'},body:JSON.stringify({nickname:name,score,seconds:Math.floor(elapsed),items:hits})});if(!r.ok)throw Error(r.status);toast('已提交全球排行榜！')}catch(e){submitted=false;toast('雲端連線失敗，本機成績已保存')}}
async function rank(){state='rank';uiGame(false);overlay.style.display='flex';let arr=JSON.parse(localStorage.getItem('catScores')||'[]'),label='📱 這台裝置的排行榜';if(CLOUD.url&&CLOUD.anonKey){try{let r=await fetch(CLOUD.url.replace(/\/$/,'')+'/rest/v1/cat_scores?select=nickname,score,seconds,items&order=score.desc&limit=100',{headers:{apikey:CLOUD.anonKey,Authorization:'Bearer '+CLOUD.anonKey}});if(!r.ok)throw Error();arr=(await r.json()).map(v=>({name:v.nickname,score:v.score,time:v.seconds,hits:v.items}));label='🌍 全球排行榜'}catch(e){label='📱 本機排行榜（雲端暫不可用）'}}overlay.innerHTML=`<div class="panel"><h2>🏆 搗蛋排行榜</h2><span class="tag">${label}</span><table class="leader"><thead><tr><th>排名</th><th>玩家</th><th>分數</th><th>秒數</th></tr></thead><tbody>${arr.length?arr.slice(0,20).map((a,i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${escapeHtml(a.name||'匿名貓奴')}</td><td>${Number(a.score).toLocaleString()}</td><td>${Number(a.time)||0}</td></tr>`).join(''):'<tr><td colspan="4">還沒有紀錄，快來當第一隻壞貓！</td></tr>'}</tbody></table><div class="buttons"><button class="btn" id="back">回主選單</button></div></div>`;$('#back').onclick=menu}
function scoreCanvas(){const c=document.createElement('canvas');c.width=720;c.height=1080;const g=c.getContext('2d');g.fillStyle='#f6ecdf';g.fillRect(0,0,720,1080);g.fillStyle='#d9e4d4';g.fillRect(30,30,660,1020);g.fillStyle='#fff8ef';g.beginPath();g.roundRect(55,55,610,970,35);g.fill();g.textAlign='center';g.fillStyle='#624d41';g.font='bold 55px system-ui';g.fillText('貓咪搗蛋計畫 🐾',360,155);const pic=img[sadOrWin()];if(pic.complete&&pic.naturalWidth){g.save();g.beginPath();g.roundRect(140,195,440,440,32);g.clip();const scale=Math.max(440/pic.width,440/pic.height);g.drawImage(pic,360-pic.width*scale/2,415-pic.height*scale/2,pic.width*scale,pic.height*scale);g.restore()}g.font='bold 42px system-ui';g.fillStyle='#75584b';g.fillText('遊戲結束 · 委屈巴巴',360,710);g.font='bold 105px system-ui';g.fillText(score.toLocaleString(),360,840);g.font='bold 29px system-ui';g.fillText(`撥落 ${hits} 件  ·  存活 ${Math.floor(elapsed)} 秒`,360,900);g.font='23px system-ui';g.fillText('你敢來挑戰我的分數嗎？',360,967);return c}
function sadOrWin(){return score>=1000?'dance':'sad'}function downloadScore(){scoreCanvas().toBlob(b=>{if(!b)return;let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='貓咪搗蛋計畫_'+score+'分.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
async function shareScore(){const c=scoreCanvas(),msg=`🐾 我在《貓咪搗蛋計畫》撥掉 ${hits} 件東西，拿到 ${score} 分！你能贏我嗎？ ${location.href}`;try{let b=await new Promise(r=>c.toBlob(r,'image/png'));let f=new File([b],'cat-score.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'貓咪搗蛋計畫',text:msg});return}if(navigator.share){await navigator.share({title:'貓咪搗蛋計畫',text:msg,url:location.href});return}await navigator.clipboard.writeText(msg);downloadScore();toast('已複製文字並下載成績圖')}catch(e){if(e.name!=='AbortError'){downloadScore();toast('已下載成績圖，可自行分享')}}}

function moveCat(d){if(state!=='play')return;if(owner.phase==='look'){lose();return}cat.x=Math.max(.41,Math.min(.9,cat.x+d));cat.move=.18}function floorCat(d){if(state!=='play')return;if(owner.phase==='look'){lose();return}cat.floor=Math.max(0,Math.min(2,cat.floor+d));cat.move=.18;sound(420,.07)}
let tx=0,ty=0,down=false;cv.addEventListener('pointerdown',e=>{if(state!=='play')return;tx=e.clientX;ty=e.clientY;down=true});cv.addEventListener('pointerup',e=>{if(!down||state!=='play')return;down=false;let dx=e.clientX-tx,dy=e.clientY-ty;if(Math.abs(dy)>38&&Math.abs(dy)>Math.abs(dx)*.8){floorCat(dy<0?1:-1)}else if(Math.abs(dx)>25){moveCat(dx/W*.95)}else{let rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)/W,y=e.clientY-rect.top;let near=objects.filter(o=>o.active&&o.f===cat.floor).sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))[0];if(near&&Math.abs(near.x-x)<.17&&Math.abs(y-shelfY(cat.floor))<100){cat.x=near.x;swat()}else swat()}});
